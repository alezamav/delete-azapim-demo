name: destroy-infra

# Este pipeline BORRA el laboratorio. No se dispara con push:
# una correccion del README no debe destruir la infraestructura.
# Solo se ejecuta a mano y exige escribir DESTRUIR para confirmar.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe DESTRUIR para confirmar el borrado del laboratorio'
        required: true
        default: ''

env:
  RG: rg-cardops-demo
  APIM_NAME: apim-cardops-demo
  APIM_LOCATION: eastus

# -----------------------------------------------------------------------------
# ALCANCE DE ESTE PIPELINE
#
# El Service Principal tiene Contributor SOLO sobre rg-cardops-demo. Al borrar
# ese Resource Group desaparece tambien su asignacion de rol, porque estaba al
# ambito de ese RG. A partir de ese momento el SP no tiene ningun permiso en la
# suscripcion: ni siquiera resourceGroups/read.
#
# Por eso este pipeline hace una sola cosa: borrar el RG. Todo lo que hay que
# comprobar despues (el RG de nodos MC_, el soft delete de APIM) vive fuera de
# ese RG y requiere permisos de suscripcion, asi que se verifica con
# verificar.ps1 desde Cloud Shell con una cuenta de usuario.
#
# La alternativa seria dar Reader al SP sobre toda la suscripcion. Para un
# laboratorio no compensa: un comando manual al resetear es menos superficie
# de permisos que un rol permanente sobre todo.
# -----------------------------------------------------------------------------

jobs:
  destroy:
    runs-on: ubuntu-latest
    # El borrado del RG con APIM dentro tarda entre 10 y 50 min segun la carga
    # de la region. Esperamos de verdad: con --no-wait la validacion no valida.
    timeout-minutes: 120

    steps:
      # =====================================
      # Confirmacion explicita
      # =====================================
      - name: Verificar confirmacion
        run: |
          if [ "${{ inputs.confirmar }}" != "DESTRUIR" ]; then
            echo "::error::Confirmacion incorrecta. Escribe exactamente DESTRUIR."
            exit 1
          fi
          echo "Confirmacion aceptada."

      # =====================================
      # Azure login
      # =====================================
      # allow-no-subscriptions: cuando el laboratorio ya esta destruido, el SP
      # se quedo sin asignacion de rol y no ve ninguna suscripcion. Sin esta
      # opcion la accion falla con "No subscriptions found" y el pipeline sale
      # en rojo, cuando en realidad el estado es el correcto: no hay nada que
      # destruir. Con ella el login pasa y lo decide el paso siguiente.
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          allow-no-subscriptions: true

      # =====================================
      # Hay algo que destruir?
      # =====================================
      - name: Comprobar si queda laboratorio
        id: estado
        run: |
          N=$(az account list --query "length(@)" -o tsv 2>/dev/null || echo 0)
          if [ "$N" = "0" ]; then
            echo "El Service Principal no tiene acceso a ninguna suscripcion."
            echo "Esto es lo normal cuando el laboratorio ya esta destruido: al"
            echo "borrar $RG desaparecio tambien su asignacion de rol."
            echo "Nada que destruir."
            echo "hay=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          az account set --subscription "$(az account list --query '[0].id' -o tsv)"

          if [ "$(az group exists --name "$RG")" = "false" ]; then
            echo "El Resource Group $RG no existe. Nada que destruir."
            echo "hay=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Recursos en $RG:"
          az resource list --resource-group "$RG" \
            --query "[].{nombre:name, tipo:type, region:location}" -o table
          echo "hay=true" >> "$GITHUB_OUTPUT"

      # =====================================
      # Borrado del Resource Group, esperando a que termine
      # =====================================
      # Sin --no-wait a proposito: queremos que el job termine cuando Azure
      # haya terminado, no cuando haya aceptado la peticion.
      - name: Borrar Resource Group (AKS + APIM + Cosmos)
        if: steps.estado.outputs.hay == 'true'
        run: |
          echo "Borrando $RG. Puede tardar entre 10 y 50 min por APIM."
          az group delete --name "$RG" --yes
          echo "Resource Group borrado."

      # =====================================
      # Cierre: que queda por hacer a mano
      # =====================================
      # A partir de aqui el SP ya no tiene permisos (su role assignment se fue
      # con el RG), asi que el pipeline no intenta comprobar nada mas: imprime
      # los comandos y termina en verde.
      - name: Pendiente de verificacion manual
        if: steps.estado.outputs.hay == 'true'
        run: |
          {
            echo "## Resource Group \`$RG\` borrado"
            echo ""
            echo "El Service Principal perdio sus permisos al borrarse el RG"
            echo "(su asignacion de rol estaba al ambito de ese RG), asi que el"
            echo "resto se comprueba desde Cloud Shell con una cuenta de usuario:"
            echo ""
            echo '```bash'
            echo "az group list --query \"[?contains(name,'cardops')].name\" -o tsv"
            echo "az apim deletedservice list -o table"
            echo "az apim deletedservice purge --service-name $APIM_NAME --location $APIM_LOCATION"
            echo '```'
            echo ""
            echo "La primera debe salir vacia, incluido el RG de nodos \`MC_${RG}_...\`."
            echo "La tercera libera el nombre \`$APIM_NAME\`, reservado 48 h por el soft delete."
            echo ""
            echo "O, en la misma Cloud Shell: \`./verificar.ps1\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Borrado completado. Verificacion manual pendiente (ver el resumen del job)."

      # =====================================
      # Nada que destruir: salida limpia
      # =====================================
      - name: Laboratorio ya en cero
        if: steps.estado.outputs.hay != 'true'
        run: |
          {
            echo "## Nada que destruir"
            echo ""
            echo "El laboratorio ya estaba en cero. El pipeline no hizo cambios."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Nada que destruir. El pipeline no hizo cambios."
